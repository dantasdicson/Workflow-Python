services:
  - type: web
    runtime: node
    name: workflow-python
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://workflow-python-api.onrender.com

  - type: web
    runtime: python
    name: workflow-python-api
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn workflow.wsgi:application
    healthCheckPath: /api/categorias/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: FRONTEND_BASE_URL
        value: https://workflow-python.onrender.com
      - key: DEFAULT_FROM_EMAIL
        value: no-reply@workflow.local
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
